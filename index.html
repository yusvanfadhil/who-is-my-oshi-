<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siapa Oshimu? - JKT48</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="Oshi.css" />
    <link rel="icon" href="logo-rounded.png" type="image/png" />
  </head>

  <body>
    <!-- Background Layers -->
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-gradient"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
      <div class="bg-stars">
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
        <span class="bg-star"></span>
      </div>
      <canvas id="particleCanvas"></canvas>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast" role="alert">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="toastMsg">Tulis namamu dulu yuk!</span>
    </div>

    <!-- Confetti Container -->
    <div class="confetti-container" id="confettiBox" aria-hidden="true"></div>

    <!-- Navbar -->
    <header class="site-navbar">
      <img class="navbar-banner" src="nav-banner.png" alt="JKT48" />
      <label class="language-control" for="languageSelect">
        <i class="fa-solid fa-globe" aria-hidden="true"></i>
        <select id="languageSelect" aria-label="Pilih bahasa">
          <option value="id">IDN</option>
          <option value="en">ENG</option>
          <option value="ja">JPN</option>
        </select>
      </label>
    </header>

    <div class="app-layout">
      <!-- Main Card -->
      <main class="card-wrapper">
        <div class="card">
          <div class="card-inner-glow" aria-hidden="true"></div>

        <!-- Brand -->
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <i class="fa-solid fa-star"></i>
          </div>
          <p class="brand-label" id="brandLabel">JKT48 Fan Zone</p>
          <h1 class="brand-title" id="brandTitle">
            Siapa <span class="highlight">Oshimu</span>?
          </h1>
        </div>

        <!-- Subtitle -->
        <p class="subtitle">
          <span id="subtitleText">Masukkan namamu, lalu temukan siapa member JKT48 yang jadi oshimu!</span>
          <br />
          <a
            href="https://jkt48.com/member"
            target="_blank"
            rel="noopener"
          >
            <span id="memberLinkText">Lihat daftar member</span>
            <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.6rem;"></i>
          </a>
        </p>

        <!-- Divider -->
        <div class="divider" aria-hidden="true">
          <span class="divider-line"></span>
          <span class="divider-dot"></span>
          <span class="divider-line"></span>
        </div>

        <!-- Input -->
        <div class="input-group">
          <i class="fa-solid fa-user icon-left" aria-hidden="true"></i>
          <input
            type="text"
            id="nameInput"
            class="input-field"
            placeholder="Ketik namamu di sini..."
            aria-label="Nama kamu"
            maxlength="50"
            autocomplete="off"
          />
        </div>

        <!-- Buttons -->
        <div class="btn-group">
          <button class="btn-submit" id="submitBtn" aria-label="Cari oshi">
            <span>
              <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
              <span id="submitText">Cari Oshimu</span>
            </span>
          </button>
          <button class="btn-reset" id="resetButton" aria-label="Reset">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Result -->
        <div class="result-area" id="resultArea">
          <div class="result-card">
            <p class="result-label">
              <i class="fa-solid fa-crown" aria-hidden="true"></i>
              <span id="resultLabelText">Oshimu adalah</span>
            </p>
            <p class="result-name" id="nameDisplay"></p>
            <p class="result-hint" id="resultHint"></p>
          </div>
        </div>

        <!-- Footer -->
        <p class="footer-tag">
          <i class="fa-solid fa-star star-icon" aria-hidden="true"></i>
          <span id="footerText">Satu Hati, Satu Cinta, JKT48</span>
          <i class="fa-solid fa-star star-icon" aria-hidden="true"></i>
        </p>
        </div>
      </main>

      <!-- Saved Results -->
      <aside class="history-panel" aria-live="polite">
        <div class="history-header">
          <p class="history-label" id="historyLabel">Riwayat Oshi</p>
          <span class="history-count" id="historyCount">0</span>
        </div>
        <div class="history-list" id="historyList">
          <p class="history-empty" id="historyEmpty">Belum ada hasil.</p>
        </div>
      </aside>
    </div>

    <script src="Oshi.js"></script>
  </body>
</html>
